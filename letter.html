<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>write own your own</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8e1f4, #e0c3f7, #c2e6ff);
            background-size: 400% 400%;
            animation: gradientBackground 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 3s forwards 0.5s;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            color: #8c4c9300;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Letter Section */
        .letter-container {
            background: rgba(255, 255, 255, 0.67);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(87, 76, 147, 0.258);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .letter-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(216, 215, 255, 0.7);
            pointer-events: none;
            z-index: 1;
        }

        .letter {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
            position: relative;
            z-index: 2;
            min-height: 200px;
        }

        .video-container {
            display: none;
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            margin-bottom: 40px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(106, 76, 147, 0.3), 0 0 30px rgba(255, 215, 232, 0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Surprise Button */
        .surprise-button-container {
            text-align: center;
            margin: 30px 0;
        }

        .surprise-button {
            background: linear-gradient(45deg, #6a2c3d, #a1435c, #c97b63, #8c4c93);
            background-size: 300% 300%;
            animation: gradientButton 6s ease infinite;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(140, 76, 147, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .surprise-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(140, 76, 147, 0.7);
        }

        .surprise-button:active {
            transform: translateY(1px);
        }

        @keyframes gradientButton {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Gift Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 10, 20, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: linear-gradient(160deg, #fdf3f0 0%, #f3e0e6 45%, #e9d5e8 100%);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 35px 30px;
            position: relative;
            transform: scale(0.85);
            transition: all 0.35s ease;
            box-shadow: 0 0 40px rgba(140, 76, 147, 0.5);
            text-align: center;
            border: 1px solid rgba(169, 90, 100, 0.25);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 26px;
            color: #7a3b4a;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        .modal-title {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 1.6rem;
            color: #6a2c3d;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .gift-image-frame {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(106, 44, 61, 0.35);
            border: 3px solid #c97b63;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #d9a5a5, #b98cae);
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-image-frame img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .gift-image-placeholder-text {
            color: rgba(255,255,255,0.85);
            font-size: 0.95rem;
            padding: 20px;
        }

        .gift-caption {
            font-size: 1.15rem;
            font-weight: 600;
            color: #7a3b4a;
            margin-bottom: 22px;
            font-style: italic;
        }

        .gift-promise {
            background: rgba(255, 255, 255, 0.55);
            border-left: 3px solid #a1435c;
            border-radius: 10px;
            padding: 16px 18px;
            text-align: left;
            font-size: 0.98rem;
            line-height: 1.6;
            color: #5a2d38;
        }

        .gift-signature {
            margin-top: 14px;
            text-align: right;
            font-style: italic;
            font-weight: bold;
            color: #6a2c3d;
        }

        /* Back Button */
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #6a4c93;
            color: #6a4c93;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #6a4c93;
            color: white;
        }

        /* Floating Elements */
        .floating-element {
            position: absolute;
            pointer-events: none;
            opacity: 0.7;
            z-index: 1;
            animation-name: float;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        /* Music Controls */
        .music-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(106, 76, 147, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .music-controls:hover {
            transform: scale(1.1);
        }

        .music-controls i {
            color: #6a4c93;
            font-size: 24px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gradientBackground {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Cursor Effect */
        .cursor-effect {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.7);
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 15px;
            }

            .letter-container {
                padding: 20px;
            }

            .letter {
                font-size: 1rem;
            }

            .floating-element {
                max-width: 40px;
                max-height: 40px;
            }
        }

        /* Cake Scene */
        .cake-section {
            position: relative;
            margin: 40px 0;
            padding: 50px 20px 60px;
            border-radius: 24px;
            background: radial-gradient(ellipse at center, #2a0e1a 0%, #16050c 65%, #0a0308 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .cake-heading {
            text-align: center;
            color: #f6cfe0;
            font-size: 1.7rem;
            font-style: italic;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 182, 213, 0.5);
            position: relative;
            z-index: 5;
        }

        .cake-subheading {
            text-align: center;
            color: rgba(246, 207, 224, 0.6);
            font-size: 0.95rem;
            margin-bottom: 30px;
            position: relative;
            z-index: 5;
        }

        .cake-stage {
            perspective: 1400px;
            height: 460px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
        }

        .balloon {
            position: absolute;
            width: 46px;
            height: 58px;
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            opacity: 0.85;
            animation: balloonFloat 6s ease-in-out infinite;
            filter: drop-shadow(0 0 12px currentColor);
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -34px;
            left: 50%;
            width: 1px;
            height: 34px;
            background: rgba(255,255,255,0.3);
        }

        .balloon.b1 { background: #a1435c; color: #a1435c; top: 8%; left: 8%; animation-delay: 0s; }
        .balloon.b2 { background: #6a2c8f; color: #6a2c8f; top: 4%; left: 22%; animation-delay: 1.2s; }
        .balloon.b3 { background: #c97b63; color: #c97b63; top: 6%; right: 20%; animation-delay: 0.6s; }
        .balloon.b4 { background: #d46a9a; color: #d46a9a; top: 2%; right: 8%; animation-delay: 1.8s; }
        .balloon.b5 { background: #8c4c93; color: #8c4c93; top: 14%; left: 45%; animation-delay: 2.4s; width: 36px; height: 46px; }

        @keyframes balloonFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-18px) rotate(3deg); }
        }

        .sparkle {
            position: absolute;
            color: #f6cfe0;
            font-size: 14px;
            opacity: 0;
            animation: sparkleTwinkle 3s ease-in-out infinite;
        }

        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.9; transform: scale(1.1); }
        }

        .cake-wrapper {
            position: relative;
            transform-style: preserve-3d;
        }

        .cake {
            position: relative;
            transform-style: preserve-3d;
            animation: cakeRotate 14s ease-in-out infinite;
        }

        @keyframes cakeRotate {
            0%   { transform: rotateX(10deg) rotateY(0deg); }
            30%  { transform: rotateX(10deg) rotateY(360deg); }
            45%  { transform: rotateX(58deg) rotateY(360deg); }
            65%  { transform: rotateX(58deg) rotateY(360deg); }
            80%  { transform: rotateX(10deg) rotateY(360deg); }
            100% { transform: rotateX(10deg) rotateY(720deg); }
        }

        .tier {
            position: relative;
            margin: 0 auto;
            border-radius: 50%;
            background: linear-gradient(180deg, #6b4530 0%, #4a2c1c 55%, #331d11 100%);
            box-shadow:
                inset -14px 0 24px rgba(0,0,0,0.45),
                inset 14px 0 24px rgba(255,220,200,0.06),
                0 12px 22px rgba(0,0,0,0.5);
        }

        .tier::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(180deg, #7c5236, #5a3a24);
            box-shadow: inset 0 -4px 10px rgba(0,0,0,0.35);
        }

        .tier-3 { width: 260px; height: 90px; z-index: 1; }
        .tier-2 { width: 200px; height: 80px; z-index: 2; margin-top: -14px; }
        .tier-1 { width: 150px; height: 70px; z-index: 3; margin-top: -12px; }

        .cake-top-disc {
            position: absolute;
            top: -46px;
            left: 50%;
            width: 150px;
            height: 150px;
            margin-left: -75px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #5a3a24, #2e1810 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .cake-top-text {
            text-align: center;
            color: #f8dfe9;
            text-shadow: 0 0 6px rgba(0,0,0,0.6);
        }

        .cake-top-text .name {
            display: block;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .cake-top-text .line {
            display: block;
            font-size: 0.62rem;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .cake-top-text .age {
            display: block;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 2px;
        }

        .candles {
            position: absolute;
            top: -76px;
            left: 50%;
            width: 130px;
            margin-left: -65px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .candle {
            position: relative;
            width: 8px;
            height: 40px;
            border-radius: 3px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .candle.red { background: linear-gradient(180deg, #c94f5e, #7a1f2b); }
        .candle.purple { background: linear-gradient(180deg, #9a5cc9, #4d2470); }
        .candle.brown { background: linear-gradient(180deg, #8a5a3c, #4a2e1b); }
        .candle.pink { background: linear-gradient(180deg, #f0a3c4, #b85a86); }

        .flame {
            position: absolute;
            top: -20px;
            left: 50%;
            width: 10px;
            height: 18px;
            margin-left: -5px;
            background: radial-gradient(circle at 50% 70%, #fff3b0, #ffa93b 55%, #ff6a2b 90%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            box-shadow: 0 0 12px 4px rgba(255,150,50,0.7), 0 0 24px 8px rgba(255,90,30,0.4);
            animation: flicker 0.6s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        @keyframes flicker {
            0%   { transform: scaleY(1) rotate(-2deg); }
            50%  { transform: scaleY(1.1) rotate(2deg); }
            100% { transform: scaleY(0.95) rotate(-1deg); }
        }

        @media (max-width: 768px) {
            .cake-stage { height: 380px; transform: scale(0.85); }
            .cake-heading { font-size: 1.4rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>For My Unknown Bestie ❤️</h1>
        </header>

        <div class="letter-container">
            <div class="letter" id="typed-text"></div>
        </div>

        <div class="video-container" id="video-message">
            <!-- Replace with your video embed code -->
            <iframe src="about:blank" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="cake-section">
            <h2 class="cake-heading">A little something before the gift 🎂</h2>
            <p class="cake-subheading">watch it turn to see your name</p>

            <div class="cake-stage">
                <div class="balloon b1"></div>
                <div class="balloon b2"></div>

                <div class="balloon b5"></div>
                <div class="sparkle" style="top:20%; left:15%; animation-delay:0s;">✦</div>

                <div class="cake-wrapper">
                    <div class="cake">
                        <div class="candles">

                            <div class="candle pink"><div class="flame"></div></div>
                        </div>
                        <div class="cake-top-disc">
                            <div class="cake-top-text">
                                <span class="name">.....</span>
                                <span class="line">Happy Birthday</span>
                                <span class="age">Finally ...</span>
                            </div>
                        </div>
                        <div class="tier tier-1"></div>
                        <div class="tier tier-2"></div>
                        <div class="tier tier-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="surprise-button-container">
            <button class="surprise-button" id="surprise-button">
                ..........
            </button>
        </div>

        <div class="navigation">
            <a href="cake.html" class="back-button">
                <i class="fas fa-arrow-left"></i> 
                 CAKE!
            </a>
        </div>
    </div>

    <!-- Gift Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="modal-close" id="modal-close">×</button>
            <h2 class="modal-title">🎁 Your Gift 🎁</h2>

            <div class="gift-image-frame">
                <!-- Replace src below with your picture, e.g. "gift-photo.jpg" -->
                <img src="gift-photo.jpg" alt="Your gift" onerror="this.style.display='none'; this.parentElement.querySelector('.gift-image-placeholder-text').style.display='block';">
                <div class="gift-image-placeholder-text" style="display:none;">
                    Add your picture here — save it as <b>gift-photo.jpg</b> next to this file.
                </div>
            </div>

            <p class="gift-caption">This is a gift for you, My beautiful......</p>

            <div class="gift-promise">
                .......
            </div>
            <div class="gift-signature">— .....</div>
        </div>
    </div>

    <!-- Music Controls -->
    <div class="music-controls" id="music-toggle">
        <i class="fas fa-volume-mute" id="music-icon"></i>
    </div>

    <!-- Audio Elements -->
    <audio id="click-sound" preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_bb630cc098.mp3?filename=cute-notification-ringtone-1-173850.mp3" type="audio/mpeg">
    </audio>
    <div id="yt-player" style="position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.5.1/confetti.browser.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fade in animation
            setTimeout(() => {
                document.querySelector('.container').style.opacity = 1;
            }, 500);

            // Typewriter effect for letter
            const letterContent = "  .......?";
            
            new Typed('#typed-text', {
                strings: [letterContent],
                typeSpeed: 30,
                showCursor: true,
                cursorChar: '|'
            });

            // Create floating elements
            const floatingElements = [
                { type: 'heart', color: '#ff6b8a', size: '20px' },
                { type: 'heart', color: '#f48fb1', size: '30px' },
                { type: 'star', color: '#ffd54f', size: '25px' },
                { type: 'star', color: '#ffecb3', size: '15px' },
                { type: 'teddy', emoji: '🧸', size: '30px' },
                { type: 'sparkle', emoji: '✨', size: '25px' },
                { type: 'sparkle', emoji: '✨', size: '20px' },
                { type: 'heart', color: '#ff6b8a', size: '25px' },
                { type: 'star', color: '#ffd54f', size: '20px' },
                { type: 'teddy', emoji: '🧸', size: '25px' }
            ];

            floatingElements.forEach((element, index) => {
                createFloatingElement(element, index);
            });

            // Cursor effect
            document.addEventListener('mousemove', createCursorEffect);

            // Gift button functionality
            const surpriseButton = document.getElementById('surprise-button');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalClose = document.getElementById('modal-close');
            const clickSound = document.getElementById('click-sound');

            surpriseButton.addEventListener('click', function() {
                clickSound.play().catch(e => console.log('Audio play error:', e));
                modalOverlay.classList.add('active');
                confetti({
                    particleCount: 100,
                    spread: 70,
                    colors: ['#a1435c', '#c97b63', '#8c4c93', '#6a2c3d'],
                    origin: { y: 0.6 }
                });
            });

            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('active');
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.classList.remove('active');
                }
            });

            // Rotating song playlist: changes every 10s, or after 3 clicks anywhere
            const RANDOM_PLAYLIST = [
                'Gz38Yj09k3A', 'xvT1jH8B9AM', 'rC-kbRanJQ0', 'S3rdEQ0M7n4', 'k-fd9leBVtQ',
                'kX0vO4vlJuU', 'HZsiToZ8zCI', 'Z3aduh5fxCo', 'RhAv7mh9J2c', 'M8nhouDBIjY',
                'Es4NrOnoNb4', 'Bt6TmXqRCb4', 'cwxPcmONwzk', 'nDjloeIB3Pc', 'gdZLi9oWNZg'
            ];
            let rotateTimer = null;
            let needsMidSeek = false;
            let currentSongId = RANDOM_PLAYLIST[0];
            let ytPlayer;
            let ytReady = false;

            const musicToggle = document.getElementById('music-toggle');
            const musicIcon = document.getElementById('music-icon');
            let isMusicPlaying = false;

            window.onYouTubeIframeAPIReady = function() {
                ytPlayer = new YT.Player('yt-player', {
                    height: '1',
                    width: '1',
                    videoId: currentSongId,
                    playerVars: {
                        autoplay: 1,
                        mute: 1,
                        controls: 0,
                        modestbranding: 1,
                        rel: 0
                    },
                    events: {
                        onReady: () => {
                            ytReady = true;
                            ytPlayer.playVideo();
                            isMusicPlaying = true;
                            musicIcon.classList.remove('fa-volume-mute');
                            musicIcon.classList.add('fa-volume-up');
                            startRotation();
                        },
                        onStateChange: onPlayerStateChange
                    }
                });
            };

            function onPlayerStateChange(event) {
                if (event.data === YT.PlayerState.PLAYING && needsMidSeek) {
                    needsMidSeek = false;
                    const dur = ytPlayer.getDuration();
                    if (dur > 0) ytPlayer.seekTo(dur / 2, true);
                }
            }

            function playRandomSong() {
                if (!ytReady) return;
                let id = RANDOM_PLAYLIST[Math.floor(Math.random() * RANDOM_PLAYLIST.length)];
                if (RANDOM_PLAYLIST.length > 1 && id === currentSongId) {
                    id = RANDOM_PLAYLIST[(RANDOM_PLAYLIST.indexOf(id) + 1) % RANDOM_PLAYLIST.length];
                }
                currentSongId = id;
                needsMidSeek = true;
                ytPlayer.loadVideoById({ videoId: id });
            }

            function startRotation() {
                if (rotateTimer) clearInterval(rotateTimer);
                rotateTimer = setInterval(playRandomSong, 8000);
            }

            musicToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!ytReady) return;
                if (isMusicPlaying) {
                    ytPlayer.pauseVideo();
                    musicIcon.classList.remove('fa-volume-up');
                    musicIcon.classList.add('fa-volume-mute');
                } else {
                    ytPlayer.unMute();
                    ytPlayer.playVideo();
                    musicIcon.classList.remove('fa-volume-mute');
                    musicIcon.classList.add('fa-volume-up');
                }
                isMusicPlaying = !isMusicPlaying;
            });

            // Any click anywhere switches to a new random song, and unmutes
            document.addEventListener('click', function() {
                if (ytReady && ytPlayer.isMuted && ytPlayer.isMuted()) {
                    ytPlayer.unMute();
                }
                playRandomSong();
                startRotation();
            });

            // Helper Functions
            function createFloatingElement(element, index) {
                const floatingElement = document.createElement('div');
                floatingElement.classList.add('floating-element');
                
                if (element.emoji) {
                    floatingElement.textContent = element.emoji;
                    floatingElement.style.fontSize = element.size;
                } else if (element.type === 'heart') {
                    floatingElement.innerHTML = '<i class="fas fa-heart"></i>';
                    floatingElement.style.color = element.color;
                    floatingElement.style.fontSize = element.size;
                } else if (element.type === 'star') {
                    floatingElement.innerHTML = '<i class="fas fa-star"></i>';
                    floatingElement.style.color = element.color;
                    floatingElement.style.fontSize = element.size;
                }
                
                // Random positioning
                const randomX = Math.random() * window.innerWidth;
                const randomY = Math.random() * window.innerHeight;
                floatingElement.style.left = `${randomX}px`;
                floatingElement.style.top = `${randomY}px`;
                
                // Animation duration and delay
                const duration = 5 + Math.random() * 10;
                const delay = Math.random() * 5;
                floatingElement.style.animationDuration = `${duration}s`;
                floatingElement.style.animationDelay = `${delay}s`;
                
                document.body.appendChild(floatingElement);
            }

            function createCursorEffect(e) {
                const cursorEffect = document.createElement('div');
                cursorEffect.classList.add('cursor-effect');
                cursorEffect.style.left = `${e.pageX}px`;
                cursorEffect.style.top = `${e.pageY}px`;
                document.body.appendChild(cursorEffect);
                
                setTimeout(() => {
                    cursorEffect.style.opacity = 1;
                    cursorEffect.style.transform = `translate(-50%, -50%) scale(${Math.random() * 0.5 + 0.5})`;
                    
                    setTimeout(() => {
                        cursorEffect.style.opacity = 0;
                        setTimeout(() => {
                            cursorEffect.remove();
                        }, 500);
                    }, 300);
                }, 10);
            }
        });
    </script>

    <audio id="audio-player" style="display:none;"></audio>
    <script src="audio-player.js"></script>
</body>
